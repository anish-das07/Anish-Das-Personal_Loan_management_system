# Optional: run without MySQL (in-memory H2, data lost on stop).  -Dspring.profiles.active=h2
spring:
  datasource:
    url: jdbc:h2:mem:plms;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
