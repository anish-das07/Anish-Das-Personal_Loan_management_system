# PLMS backend - default configuration: MySQL 8.
#
# No SQL scripts are needed:
#   * createDatabaseIfNotExist=true  -> the MySQL driver creates the 'plms' database on first connect
#   * Flyway (db/migration/V1__init.sql) -> creates all 23 tables on first start
#   * DataSeeder                     -> inserts demo staff users, products and the eligibility policy
#
# Only set your MySQL root password: edit the default after "PLMS_DB_PASSWORD:" below, or (better) set the
# environment variable PLMS_DB_PASSWORD in the Eclipse run configuration.
spring:
  application:
    name: plms-backend
  datasource:
    url: ${PLMS_DB_URL:jdbc:mysql://localhost:3306/plms?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${PLMS_DB_USER:root}
    password: ${PLMS_DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate never changes tables.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

plms:
  time-zone: Asia/Kolkata
  security:
    # Dev-only fallback. The mysql/production profile has no default and fails fast without PLMS_JWT_SECRET.
    jwt-secret: ${PLMS_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: plms-auth
    audience: plms-api
    access-token-ttl: 15m
    refresh-token-ttl: 7d
    reset-token-ttl: 30m
    max-failed-logins: 5
    lockout-window: 15m
  documents:
    storage-dir: ${PLMS_DOCUMENT_DIR:./data/documents}
    max-bytes: 5242880
    mandatory-categories:
      - IDENTITY_PROOF
      - INCOME_PROOF
  approval:
    maker-checker: true
    require-recommendation: true
  credit:
    timeout: 3s
    retry-attempts: 2
    circuit-window-size: 20
    circuit-failure-rate: 50
    circuit-wait-open: 10s
  seed:
    enabled: ${PLMS_SEED_ENABLED:true}
    staff-password: ${PLMS_SEED_STAFF_PASSWORD:ChangeMe-2026}

logging:
  pattern:
    console: "%d{ISO8601} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"
